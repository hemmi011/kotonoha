# PostgreSQL
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: password
  host: db

development:
  <<: *default
  database: kotonoha_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: kotonoha_test

# 本番はNeonの接続文字列を環境変数 DATABASE_URL で渡す。
# Railsが DATABASE_URL の値を上のdefaultに重ねて使ってくれる。
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
